<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="paper.css">
<style>
  .paper { font-family: "Chalkboard SE", "Comic Sans MS", sans-serif; background: #fff9ec; }
  h1 { font-size: 72px; text-align: center; color: #d2691e; margin-top: 10px; }
  .sub { text-align: center; font-size: 32px; margin-bottom: 40px; }
  .day { display: grid; grid-template-columns: 300px 1fr; border: 3px solid #333; border-radius: 14px;
    margin: 18px 0; padding: 20px 26px; font-size: 30px; }
  .day b { color: #6b2fa3; }
</style></head>
<body>
<div class="paper" style="--tilt:1.6deg">
  <h1>SPIRIT WEEK!</h1>
  <div class="sub">Maple Grove Elementary &middot; October 26&ndash;30</div>
  <div class="day"><b>Monday 10/26</b><span>Pajama Day</span></div>
  <div class="day"><b>Tuesday 10/27</b><span>Crazy Hair Day</span></div>
  <div class="day"><b>Wednesday 10/28</b><span>Twin Day &mdash; dress like a friend!</span></div>
  <div class="day"><b>Thursday 10/29</b><span>Sports Jersey Day</span></div>
  <div class="day"><b>Friday 10/30</b><span>Orange and Black Day</span></div>
  <p style="text-align:center;font-size:26px;margin-top:40px">Show your Maple Grove spirit!<br>Participation is optional and just for fun.</p>
</div>
<div class="light"></div>
</body></html>
