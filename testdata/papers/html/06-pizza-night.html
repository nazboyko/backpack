<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="paper.css">
<style>
  .paper { background: #fffaf2; text-align: center; border: 18px solid #c0392b; }
  h1 { font-family: "Marker Felt", "Arial Black", sans-serif; font-size: 110px; color: #c0392b; margin: 30px 0 0; line-height: 1; }
  .when { font-size: 50px; font-weight: bold; margin: 30px 0 10px; }
  .where { font-size: 36px; margin-bottom: 40px; }
  .slice { font-size: 150px; }
</style></head>
<body>
<div class="paper" style="--tilt:1.1deg">
  <div style="font-size:28px;letter-spacing:.12em">MAPLE GROVE PTO PRESENTS</div>
  <h1>PIZZA NIGHT</h1>
  <div class="slice">&#127829;</div>
  <div class="when">Thursday 11/5 &middot; 5&ndash;7 PM</div>
  <div class="where">Luigi's Pizzeria, 214 Main Street</div>
  <p style="font-size:30px">Dine in or take out. Tell your server you are with
  <b>Maple Grove</b> and 20% of your bill goes to the PTO.</p>
  <p style="font-size:24px;color:#555">No flyer needed. See you there!</p>
</div>
<div class="light"></div>
</body></html>
