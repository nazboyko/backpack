<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="paper.css">
<style>
  .paper { text-align: center; background: #fffdf3; }
  .big { font-family: "Arial Black", Impact, sans-serif; font-size: 96px; line-height: 1; margin: 40px 0 10px; color: #b2242a; }
  .date { font-size: 54px; font-weight: bold; margin: 20px 0 40px; }
  .frame { margin: 30px auto; width: 360px; height: 260px; border: 10px solid #e2b33a; border-radius: 20px;
    display: flex; align-items: center; justify-content: center; font-size: 120px; }
  .box { border: 3px solid #333; border-radius: 16px; padding: 22px 30px; margin: 34px 40px; text-align: left; }
</style></head>
<body>
<div class="paper" style="--tilt:0.9deg">
  <div style="font-size:26px;letter-spacing:.2em">MAPLE GROVE ELEMENTARY</div>
  <div class="big">PICTURE DAY</div>
  <div class="date">Tuesday, Nov. 3</div>
  <div class="frame">&#9786;</div>
  <p style="font-size:34px">Wear your best smile!</p>
  <div class="box">
    <b>Order online before Picture Day</b> with our school code <b>MGF26</b>.<br>
    Packages start at $19. Every student is photographed for the yearbook,
    even without an order.
  </div>
  <p style="font-size:20px;color:#555">Questions? Call the school office at 555-0142.</p>
</div>
<div class="light"></div>
</body></html>
